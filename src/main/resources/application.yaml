spring:
  application:
    name: demo

  # Render and Docker provide these values when the application starts.
  # Keeping them as environment variables prevents database credentials from
  # being committed to the repository or baked into the image.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Hibernate checks that the Java entities match the schema, while Flyway
  # remains responsible for creating and upgrading the database structure.
  jpa:
    hibernate:
      ddl-auto: validate

  # Flyway applies versioned SQL migrations at startup. The migration files
  # live under src/main/resources/db/migration and are packaged in the image.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing Supabase projects may already contain the tables without a
    # Flyway history table. Flyway records that existing schema as version 1,
    # then applies later migrations such as V2__add_google_subject.sql.
    baseline-on-migrate: true

# Render supplies PORT at runtime. The local default keeps development on 8080.
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
        - health
