# Starter OpenAPI contract for CST 438 Project 02.
# Copy to docs/openapi.yaml in your repo, then replace Workout/Exercise with YOUR resources.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: Brainworm Food Recall API
  version: 1.0.0
  description: |
    REST API for Brainworm, a food safety service that cross-references user food registries
    against FDA food recalls and triggers alerts for contaminated items.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 07
    url: https://github.com/Niko-Proud/CST-438_Project_2_API

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Users
    description: The signed-in user's own account profile
  - name: Registry
    description: A user's personal monitored food registry
  - name: Recalls
    description: Official FDA recalled food alerts matching or relevant to user items
  - name: Admin
    description: Admin-only user management

paths:
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Retrieve the currently authenticated user's profile (user role)
      description: |
        **Role:** `user` (any authenticated user).
        Validates the Google OAuth2 Bearer token and returns the caller's `User` record (`id`, `user`, `isAdmin`).
        *(Note: Passwords are never stored or returned because authentication uses OAuth2 + PKCE).*
      responses:
        '200':
          description: The currently signed-in user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/registry:
    get:
      tags: [Registry]
      operationId: listMyRegistryItems
      summary: List monitored foods in my registry (paginated, user role)
      description: |
        **Role:** `user`. Returns a paginated list of `RegistryItem` records owned by the authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of the caller's monitored food registry items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Registry]
      operationId: createRegistryItem
      summary: Add a new food item to my registry (user role)
      description: |
        **Role:** `user`. Creates a new `RegistryItem` owned by the authenticated user.
        `POST` is not idempotent; calling it twice creates two separate registry entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryItemCreate'
      responses:
        '201':
          description: Created new registry item
          headers:
            Location:
              description: URL of the newly created registry item
              schema:
                type: string
                example: /api/v1/registry/15
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/registry/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Registry]
      operationId: getRegistryItem
      summary: Retrieve details for a single monitored food item (user role)
      description: |
        **Role:** `user`. Returns the `RegistryItem` if it belongs to the caller.
      responses:
        '200':
          description: The requested registry item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Registry]
      operationId: replaceRegistryItem
      summary: Replace a monitored food's details in full (idempotent, user role)
      description: |
        **Role:** `user`. Replaces all mutable fields (`product` and `batch`) of an existing `RegistryItem` owned by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryItemCreate'
      responses:
        '200':
          description: The replaced registry item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Registry]
      operationId: deleteRegistryItem
      summary: Remove a food item from monitoring (user role)
      description: |
        **Role:** `user`. Deletes the specified `RegistryItem` if owned by the caller.
      responses:
        '204':
          description: Deleted successfully. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/recalls:
    get:
      tags: [Recalls]
      operationId: listRecalls
      summary: List active food recalls (sortable, filterable, paginated, user role)
      description: |
        **Role:** `user`. Lists FDA recalled foods sorted by `recallDate` and optionally filtered by product keyword.
      parameters:
        - name: sort
          in: query
          description: Field and direction, Spring Pageable style.
          schema:
            type: string
            enum: ['recallDate,desc', 'recallDate,asc']
            default: 'recallDate,desc'
        - name: product
          in: query
          description: Optional keyword filter to search recalled food products
          schema:
            type: string
            example: Spinach
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A sorted page of recalled food alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalledFoodPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/recalls/{recallId}:
    parameters:
      - $ref: '#/components/parameters/RecallId'
    get:
      tags: [Recalls]
      operationId: getRecallById
      summary: View details of a specific recall alert (user role)
      description: |
        **Role:** `user`. Retrieves full contamination, batch, and date details for a single `RecalledFood` entry.
      responses:
        '200':
          description: Details of the specific recalled food alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalledFood'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users in the system (admin only)
      description: |
        **Role:** `admin` (`isAdmin = true` in database). Regular users receive `403 Forbidden`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  
  /api/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      operationId: getUserById
      summary: View a specific user (admin only)
      description: |
        **Role:** `admin`. Retrieves a single user's profile by ID. Regular users receive `403 Forbidden`.
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Admin]
      operationId: updateUserAdminStatus
      summary: Partially update a user to grant or revoke admin role (admin only)
      description: |
        **Role:** `admin`. Updates the user's `isAdmin` boolean flag in the database. Regular users receive `403 Forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: The updated user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Completely delete a user and all their associated data (admin only)
      description: |
        **Role:** `admin`. Deletes the user row and cascades deletion to all `RegistryItem` records they own.
      responses:
        '204':
          description: User and all associated registry items deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    WorkoutId:
      name: workoutId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    MuscleGroup:
      type: string
      enum: [CHEST, BACK, LEGS, SHOULDERS, ARMS, CORE, CARDIO]

    Workout:
      type: object
      required: [id, performedOn, exercises]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        performedOn:
          type: string
          format: date
          example: '2026-10-01'
        durationMin:
          type: integer
          minimum: 1
          nullable: true
          example: 45
        notes:
          type: string
          maxLength: 500
          nullable: true
          example: Felt strong today
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExercise'

    WorkoutCreate:
      description: Body for POST and PUT. PUT replaces every field.
      type: object
      required: [performedOn, exercises]
      properties:
        performedOn:
          type: string
          format: date
          example: '2026-10-01'
        durationMin:
          type: integer
          minimum: 1
          nullable: true
          example: 45
        notes:
          type: string
          maxLength: 500
          nullable: true
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkoutExercise'

    WorkoutPatch:
      description: Body for PATCH. Send only the fields you want to change.
      type: object
      minProperties: 1
      properties:
        durationMin:
          type: integer
          minimum: 1
          nullable: true
        notes:
          type: string
          maxLength: 500
          nullable: true

    WorkoutExercise:
      type: object
      required: [exerciseId, sets, reps]
      properties:
        exerciseId:
          type: integer
          format: int64
          example: 7
        sets:
          type: integer
          minimum: 1
          example: 3
        reps:
          type: integer
          minimum: 1
          example: 10
        weightKg:
          type: number
          format: double
          nullable: true
          example: 60.0

    Exercise:
      type: object
      required: [id, name, muscleGroup]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Back Squat
        muscleGroup:
          $ref: '#/components/schemas/MuscleGroup'

    PageMeta:
      description: >-
        Spring Data's PagedModel shape. Turn it on with
        spring.data.web.pageable.serialization-mode=via_dto in application.properties.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    WorkoutPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Workout'
        page:
          $ref: '#/components/schemas/PageMeta'

    ExercisePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
        page:
          $ref: '#/components/schemas/PageMeta'

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        email:
          type: string
          format: email
          example: sam@csumb.edu
        displayName:
          type: string
          example: Sam Otter
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [USER, ADMIN]

    UserPatch:
      description: Body for PATCH /api/v1/users/{userId}. Today the only editable field is the role.
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Workout 42 not found
        instance:
          type: string
          example: /api/v1/workouts/42

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Workout 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
